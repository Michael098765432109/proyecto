<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<title>Ejercicios recomendados - MacroSync</title>
	<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
	<link rel="stylesheet" href="../responsive.css">
	<style>
		:root {
			--bg-primary: #0f0f23;
			--bg-secondary: #1a1a2e;
			--bg-card: #16213e;
			--bg-card-hover: #1e2749;
			--text-primary: #e2e8f0;
			--text-secondary: #94a3b8;
			--text-muted: #64748b;
			--accent: #22d3ee;
			--accent-strong: #3b82f6;
			--border: rgba(148, 163, 184, 0.24);
		}

		:root[data-theme="light"] {
			--bg-primary: #f6fff9;
			--bg-secondary: #eafff1;
			--bg-card: #dff8ea;
			--bg-card-hover: #c9f0d8;
			--text-primary: #0b2a19;
			--text-secondary: #2a5c42;
			--text-muted: #3b7a55;
			--accent: #0ea37a;
			--accent-strong: #087f63;
			--border: rgba(11, 42, 25, 0.16);
		}

		* { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
		body { min-height: 100vh; background: var(--bg-primary); color: var(--text-primary); transition: background-color .25s ease, color .25s ease; }
		.gradient-header { background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%); }
		.brand-name { font-size: 1.8rem; font-weight: 800; letter-spacing: .01em; text-shadow: 0 2px 10px rgba(0,0,0,.25); }
		.brand-profile { display: inline-flex; align-items: center; margin-left: .45rem; padding: .18rem .55rem; border: 1px solid rgba(255,255,255,.28); border-radius: 999px; font-size: 1rem; font-weight: 600; color: #e2e8f0; background: rgba(255,255,255,.08); vertical-align: middle; }
		.hero-panel { background: linear-gradient(135deg, var(--bg-secondary), var(--bg-card)); border: 1px solid var(--border); }
		.profile-chip, .session-card { background: var(--bg-card); border: 1px solid var(--border); }
		.type-focus { background: rgba(34, 211, 238, 0.1); border: 1px solid var(--accent); }
		:root[data-theme="light"] .type-focus { background: rgba(14, 163, 122, 0.1); }
		.session-card { transition: transform .2s ease, background-color .2s ease, border-color .2s ease; }
		.session-card:hover { transform: translateY(-3px); background: var(--bg-card-hover); border-color: var(--accent); }
		.exercise-item { border-top: 1px solid var(--border); }
		.exercise-item:first-child { border-top: 0; }
		.accent-text { color: var(--accent); }
		.muted-text { color: var(--text-secondary); }
		.muted-subtext { color: var(--text-muted); }
		.action-button { background: linear-gradient(135deg, var(--accent-strong), var(--accent)); color: #fff; transition: transform .2s ease, filter .2s ease; }
		.action-button:hover { filter: brightness(1.08); transform: translateY(-1px); }
		.empty-state { border: 1px dashed var(--border); background: var(--bg-secondary); }
		.session-card { animation: rise-in .45s ease both; }
		.session-card:nth-child(2) { animation-delay: .06s; }
		.session-card:nth-child(3) { animation-delay: .12s; }
		.session-card:nth-child(4) { animation-delay: .18s; }
		.session-card:nth-child(5) { animation-delay: .24s; }
		@keyframes rise-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
		@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
		:root[data-theme="light"] h1, :root[data-theme="light"] h2, :root[data-theme="light"] h3 { color: var(--text-primary) !important; }
	</style>
</head>
<body>
	<div class="leaves-layer" aria-hidden="true" id="leavesLayer"></div>
	<header class="gradient-header text-white shadow-lg">
		<div class="container mx-auto px-4 py-5 flex items-center justify-between gap-4">
			<a href="index.html" class="flex items-center min-w-0" aria-label="Volver al inicio">
				<i class="fas fa-dumbbell text-cyan-300 text-2xl mr-3" style="text-shadow: -1px -1px 0 rgba(255,255,255,0.95), 1px -1px 0 rgba(255,255,255,0.95), -1px 1px 0 rgba(255,255,255,0.95), 1px 1px 0 rgba(255,255,255,0.95);" aria-hidden="true"></i>
				<span class="brand-name">MacroSync</span><span id="header-profile" class="brand-profile"></span>
			</a>
			<nav class="top-nav-scroll flex items-center gap-2">
				<a href="Calculadora_de_Macros_De_Comidas.html" class="px-3 py-2 rounded-lg border border-white/20 hover:bg-white/10 transition text-sm whitespace-nowrap">
					<i class="fas fa-utensils mr-1" aria-hidden="true"></i>Comidas
				</a>
				<a href="calculadora_metabolica.html.html" class="px-3 py-2 rounded-lg border border-white/20 hover:bg-white/10 transition text-sm whitespace-nowrap">
					<i class="fas fa-calculator mr-1" aria-hidden="true"></i>Metabolismo
				</a>
				<a href="visor_calorias.html" class="px-3 py-2 rounded-lg border border-white/20 hover:bg-white/10 transition text-sm whitespace-nowrap">
					<i class="fas fa-chart-line mr-1" aria-hidden="true"></i>Calorías
				</a>
				<a href="apartado_ejercicios_recomendados.html" class="px-3 py-2 rounded-lg border border-white/20 hover:bg-white/10 transition text-sm whitespace-nowrap">
					<i class="fas fa-dumbbell mr-1" aria-hidden="true"></i>Ejercicios
				</a>
				<a href="index.html" class="px-3 py-2 rounded-lg border border-white/20 hover:bg-white/10 transition text-sm">
					<i class="fas fa-house mr-1" aria-hidden="true"></i>Inicio
				</a>
			</nav>
		</div>
	</header>

	<main class="container mx-auto px-4 py-8 max-w-6xl">
		<section class="hero-panel rounded-xl p-6 md:p-8 mb-6">
			<div class="flex flex-col lg:flex-row lg:items-end lg:justify-between gap-6">
				<div>
					<p class="accent-text uppercase tracking-widest text-xs font-bold mb-2">Plan personalizado</p>
					<h1 class="text-3xl md:text-4xl font-bold mb-3">Tus ejercicios recomendados</h1>
					<p id="planDescription" class="muted-text max-w-2xl">Cargando tu plan de entrenamiento...</p>
				</div>
				<a href="calculadora_metabolica.html.html" class="action-button rounded-lg px-5 py-3 font-semibold inline-flex items-center justify-center whitespace-nowrap">
					<i class="fas fa-sliders mr-2" aria-hidden="true"></i>Ajustar mis datos
				</a>
			</div>
		</section>

		<section id="profileSummary" class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-8" aria-label="Datos usados para personalizar el plan"></section>
		<section id="planContent" aria-live="polite"></section>
	</main>

	<footer class="gradient-header text-gray-300 text-center py-5 mt-8">
		<p class="text-sm">Entrena con constancia y escucha a tu cuerpo.</p>
	</footer>

	<script src="bdejercicios.js"></script>
	<script>
		(function () {
			try {
				const profile = JSON.parse(localStorage.getItem('macrosync_profile') || 'null');
				const target = document.getElementById('header-profile');
				if (target && profile) target.textContent = (profile.avatar || '') + (profile.username ? ' @' + profile.username : '');
			} catch (error) { /* Perfil opcional */ }
		}());
	</script>
	<script>
		(function () {
			const THEME_KEY = 'nutry_theme';
			const root = document.documentElement;
			const leavesLayer = document.getElementById('leavesLayer');

			function applyTheme() {
				if (localStorage.getItem(THEME_KEY) === 'light') {
					root.setAttribute('data-theme', 'light');
					if (leavesLayer) leavesLayer.style.display = 'none';
				}
			}

			const activityMap = {
				'1.2': 'sedentario', '1.375': 'poco', '1.55': 'normal',
				'1.725': 'harto', '1.9': 'super_activo'
			};
			const objectiveMap = {
				'ganar-conservador': 'subir_200', 'ganar': 'subir_300', 'ganar-agresivo': 'subir_500',
				'mantener': 'mantenimiento', 'perder-suave': 'bajar_300', 'perder': 'bajar_500',
				'perder-agresivo': 'bajar_700', 'recomposicion': 'recomposicion'
			};
			const typeLabels = { fuerza: 'Pesas / gimnasio', cardio: 'Cardio', mixto: 'Entrenamiento mixto' };
			const cardioPattern = /cardio|bici|cinta|caminata|hiit|liss|sprint|jump|burpee|mountain climber|kettlebell/i;

			function readUserData() {
				try { return JSON.parse(localStorage.getItem('calculadoraMacros') || 'null'); }
				catch (error) { return null; }
			}

			function adaptExercises(exercises, type) {
				if (type === 'mixto') return exercises;
				return exercises.slice().sort(function (first, second) {
					const firstIsCardio = cardioPattern.test(first) ? 1 : 0;
					const secondIsCardio = cardioPattern.test(second) ? 1 : 0;
					return type === 'cardio' ? secondIsCardio - firstIsCardio : firstIsCardio - secondIsCardio;
				});
			}

			function renderProfile(data, frequency, objective, type) {
				const summary = [
					['fa-person-running', 'Actividad', frequency.etiqueta],
					['fa-bullseye', 'Objetivo', objective.nombre],
					['fa-heart-pulse', 'Tipo de ejercicio', typeLabels[type] || 'Entrenamiento mixto']
				];
				document.getElementById('profileSummary').innerHTML = summary.map(function (item) {
					return '<div class="profile-chip rounded-lg p-4 flex items-start gap-3">' +
						'<i class="fas ' + item[0] + ' accent-text mt-1" aria-hidden="true"></i>' +
						'<div><p class="muted-subtext text-xs uppercase tracking-wide font-semibold">' + item[1] + '</p>' +
						'<p class="font-semibold mt-1 leading-snug">' + item[2] + '</p></div></div>';
				}).join('') + '<div class="type-focus rounded-lg p-4 sm:col-span-3 flex items-start gap-3" role="status">' +
					'<i class="fas fa-filter accent-text mt-1" aria-hidden="true"></i><div><p class="accent-text text-xs uppercase tracking-wide font-bold">Criterio aplicado al plan</p>' +
					'<p class="font-semibold mt-1">Se ha tenido en cuenta tu preferencia por ' + (typeLabels[type] || 'Entrenamiento mixto') + '.</p>' +
					'<p class="muted-text text-sm mt-1">' + (type === 'cardio' ? 'Los ejercicios cardiovasculares aparecen primero en cada sesión.' : type === 'fuerza' ? 'Los ejercicios de fuerza aparecen primero y el cardio queda como complemento.' : 'Las sesiones mantienen una combinación visible de fuerza y acondicionamiento.') + '</p></div></div>';
				document.getElementById('planDescription').textContent = objective.meta + ' Intensidad orientativa: ' + objective.intensidadRPE + '.';
			}

			function renderSessions(routines, type) {
				const typeNote = type === 'cardio' ? 'Tu plan prioriza los ejercicios cardiovasculares disponibles en la rutina, con un ritmo sostenible.' :
					type === 'mixto' ? 'Tu plan combina fuerza y acondicionamiento para mantener un trabajo equilibrado.' :
					'Tu plan prioriza los ejercicios de fuerza y coloca el cardio como complemento cuando aparece en la rutina.';
				const content = '<div class="flex items-center justify-between gap-3 mb-4"><div><h2 class="text-2xl font-bold">Plan de la semana</h2>' +
					'<p class="muted-text mt-1">' + typeNote + '</p><p class="accent-text text-sm font-semibold mt-2"><i class="fas fa-filter mr-1" aria-hidden="true"></i>Adaptado a: ' + (typeLabels[type] || 'Entrenamiento mixto') + '</p></div><span class="accent-text font-semibold whitespace-nowrap">' + routines.length + ' sesiones</span></div>' +
					'<div class="grid grid-cols-1 md:grid-cols-2 gap-4">' + routines.map(function (routine) {
						return '<article class="session-card rounded-xl p-5"><div class="flex items-start justify-between gap-3 mb-4"><div>' +
							'<p class="accent-text text-sm font-bold uppercase tracking-wide">' + routine.dia + '</p><h3 class="text-xl font-bold mt-1">' + routine.enfoque + '</h3></div>' +
							'<i class="fas fa-arrow-trend-up accent-text text-xl" aria-hidden="true"></i></div>' +
							'<ul>' + adaptExercises(routine.ejercicios, type).map(function (exercise) {
								const isCardio = cardioPattern.test(exercise);
								const badge = type === 'mixto' ? ' <span class="muted-subtext text-xs">(' + (isCardio ? 'acondicionamiento' : 'fuerza') + ')</span>' : '';
								return '<li class="exercise-item py-3 flex items-start gap-3"><i class="fas fa-check accent-text mt-1" aria-hidden="true"></i><span>' + exercise + badge + '</span></li>';
							}).join('') + '</ul></article>';
					}).join('') + '</div>';
				document.getElementById('planContent').innerHTML = content;
			}

			function render() {
				const data = readUserData();
				const activity = data && activityMap[String(data.actividad)] ? String(data.actividad) : '1.55';
				const objectiveKey = data && objectiveMap[data.objetivo] ? objectiveMap[data.objetivo] : 'mantenimiento';
				const type = data && typeLabels[data.tipoEntreno] ? data.tipoEntreno : 'mixto';
				const frequency = nutryHealthFitnessDB.frecuenciasInfo[activityMap[activity]];
				const objective = nutryHealthFitnessDB.objetivos[objectiveKey];
				const routines = objective && objective.rutinasPorFrecuencia[frequency.id] || [];

				renderProfile(data, frequency, objective, type);
				if (routines.length) renderSessions(routines, type);
				else document.getElementById('planContent').innerHTML = '<div class="empty-state rounded-xl p-8 text-center"><i class="fas fa-calendar-xmark accent-text text-4xl mb-4" aria-hidden="true"></i><h2 class="text-xl font-bold mb-2">Todavía no hay sesiones para mostrar</h2><p class="muted-text">Vuelve a calcular tus datos para generar un plan nuevo.</p></div>';
			}

			applyTheme();
			render();
		}());
	</script>
</body>
</html>
